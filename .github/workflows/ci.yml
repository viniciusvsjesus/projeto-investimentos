name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      # Os contract tests batem na BRAPI de verdade e consomem cota do token:
      # ficam fora do CI por decisão da clarificação Q6. O pyproject já os
      # desmarca por padrão (addopts = -m 'not contract').
      - name: Testes
        run: pytest -v --cov=src/investimentos --cov-report=term-missing

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --target runtime -t projeto-investimentos:ci .

      - name: A imagem sobe e responde
        run: |
          docker run -d --name api -p 8000:8000 \
            -e REDIS_URL= \
            projeto-investimentos:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "serviço respondeu"
              curl -s http://localhost:8000/health
              docker rm -f api
              exit 0
            fi
            sleep 2
          done
          echo "o serviço não respondeu a tempo"
          docker logs api
          exit 1
