# Contrato PUBLICADO pela nossa API — escrito ANTES da implementação (Artigo I).
# A aplicação gera o seu próprio OpenAPI em /openapi.json; o teste
# integration/test_openapi.py compara a implementação com este documento.
openapi: 3.1.0

info:
  title: Projeto Investimentos API
  version: 1.0.0
  description: |
    API que expõe cotações de ativos da B3 em um contrato próprio e estável,
    isolando os consumidores da fonte externa de dados.

servers:
  - url: http://localhost:8000
    description: Ambiente local via docker compose

tags:
  - name: cotacao
    description: Cotações de ativos
  - name: system
    description: Saúde e metadados do serviço

paths:
  /:
    get:
      tags: [system]
      summary: Índice do serviço
      description: |
        Devolve JSON com o que é o serviço, se está no ar e a URL de exemplo
        pronta para colar no navegador. Sem tela e sem redirecionamento (RF-08).
      operationId: index
      responses:
        "200":
          description: Índice do serviço
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IndexResponse" }

  /health:
    get:
      tags: [system]
      summary: Estado do serviço e das dependências
      operationId: health
      responses:
        "200":
          description: |
            Serviço no ar. `status` é `degraded` quando o cache está fora —
            a cotação continua sendo atendida (RF-06).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /cotacao/{ticker}:
    get:
      tags: [cotacao]
      summary: Cotação atual de um ativo
      operationId: getCotacao
      parameters:
        - name: ticker
          in: path
          required: true
          description: |
            Código de negociação na B3. Aceita minúsculas (normalizado para
            maiúsculas).

            O `pattern` abaixo é documentação do formato aceito, não validação
            do framework: a regra vive no domínio, e um código fora dela devolve
            `400` com o corpo de erro padrão — nunca o `422` genérico do FastAPI.
          schema:
            type: string
            pattern: "^[A-Za-z][A-Za-z0-9]{3}[0-9]{1,2}[Ff]?$"
            examples: [PETR4, B3SA3, BOVA11, MXRF11, AAPL34]
      responses:
        "200":
          description: Cotação encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteResponse" }
        "400":
          description: Código de ativo com formato inválido (nenhuma chamada externa foi feita)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "404":
          description: Ativo não encontrado na fonte
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "502":
          description: Falha de comunicação ou de contrato com a fonte externa
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "503":
          description: Cota da fonte externa esgotada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
        "504":
          description: Fonte externa excedeu o tempo limite
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }

components:
  schemas:
    QuoteResponse:
      type: object
      required: [ticker, shortName, currency, price, quotedAt, source, cached]
      properties:
        ticker:        { type: string, example: PETR4 }
        shortName:     { type: string, example: PETR4 }
        longName:      { type: [string, "null"], example: Petroleo Brasileiro SA Petrobras }
        currency:      { type: string, minLength: 3, maxLength: 3, example: BRL }
        price:         { type: number, example: 36.65 }
        change:        { type: [number, "null"], example: -0.35 }
        changePercent: { type: [number, "null"], example: -0.95 }
        volume:        { type: [integer, "null"], example: 27681100 }
        marketCap:     { type: [number, "null"], example: 483937892568 }
        quotedAt:
          type: string
          format: date-time
          description: Instante informado pela fonte, em UTC (RN-04)
          example: "2026-09-03T17:24:54Z"
        source:        { type: string, example: brapi }
        cached:
          type: boolean
          description: Indica se a resposta veio do cache (torna o RF-05 observável)
          example: false

    RotasDisponiveis:
      type: object
      required: [cotacao, saude, openapi, documentacao]
      properties:
        cotacao:      { type: string, example: "/cotacao/{ticker}" }
        saude:        { type: string, example: /health }
        openapi:      { type: string, example: /openapi.json }
        documentacao: { type: string, example: /docs }

    IndexResponse:
      type: object
      required: [servico, versao, status, exemplo, rotas]
      properties:
        servico: { type: string, example: Projeto Investimentos API }
        versao:  { type: string, example: 1.0.0 }
        status:  { type: string, example: ok }
        exemplo:
          type: string
          description: URL pronta para copiar e colar no navegador
          example: http://localhost:8000/cotacao/PETR4
        rotas:
          $ref: "#/components/schemas/RotasDisponiveis"

    HealthResponse:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        dependencies:
          type: object
          properties:
            cache:
              type: string
              enum: [ok, unavailable, disabled]

    ProblemDetail:
      type: object
      description: Corpo único de erro para toda a API (RF-10, Artigo VIII).
      required: [type, title, status]
      properties:
        type:     { type: string, example: "https://projeto-investimentos/errors/invalid-ticker" }
        title:    { type: string, example: "Código de ativo inválido" }
        status:   { type: integer, example: 400 }
        detail:   { type: [string, "null"] }
        instance: { type: [string, "null"], example: "/cotacao/PETR" }
