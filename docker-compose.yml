# Sobe o projeto inteiro com um comando (Artigo VI):
#
#     docker compose up -d
#
# Depois é só abrir http://localhost:8000 no navegador.

services:
  api:
    build:
      context: .
      target: runtime
    container_name: investimentos-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"

    # O .env entra por env_file, não por interpolação: os valores são passados
    # literalmente, o que preserva o '{ticker}' de BRAPI_QUOTE_PATH — chaves em
    # um valor interpolado com ${VAR:-default} seriam ambíguas para o Compose.
    # 'required: false' deixa o serviço subir mesmo sem .env, atendendo aos
    # tickers de sandbox da BRAPI.
    env_file:
      - path: .env
        required: false

    # Só o que precisa de padrão próprio do compose. Nenhum destes valores tem
    # chaves, então a interpolação é segura. O que vier do .env tem precedência
    # sobre estes padrões, porque o Compose também lê o .env para interpolar.
    environment:
      MAX_TICKERS_PER_REQUEST: ${MAX_TICKERS_PER_REQUEST:-3}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    depends_on:
      redis:
        # Só sobe depois que o Redis responde de fato (Artigo VI).
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: investimentos-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis-data:
